<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankey Диаграмма потоков</title>
    <!-- Подключение Bootstrap -->
    <link href="{{ url_for('static', path='/css/bootstrap.min.css') }}" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { 
            background-color: #f8f9fa; 
        }
        
        .navbar { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        }
        
        .card { 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        
        .chart-container { 
            background: white; 
            border-radius: 15px; 
            padding: 20px; 
            margin-top: 20px;
            width: 100%;
            visibility: hidden;
        }
        
        .loading-spinner { 
            display: none; 
            text-align: center; 
            padding: 50px; 
        }
        
        #chartContent {
            width: 100%;
            height: auto;
        }
        
        #chartContent .plotly-graph-div {
            width: 100% !important;
            height: auto !important;
        }
        
        .js-plotly-plot {
            width: 100% !important;
            height: auto !important;
        }

        /* Дополнительные стили для единообразия с первым кодом */
        .form-label {
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .btn-sm {
            font-size: 0.875rem;
        }

        .form-control-sm, .form-select-sm {
            font-size: 0.875rem;
        }

        .small {
            font-size: 0.875rem;
        }

        .gap-2 {
            gap: 0.5rem;
        }

        .form-switch .form-check-input {
            width: 2em;
            margin-left: -2.5em;
        }

        .form-switch .form-check-label {
            padding-left: 0.5rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-2">
        <!-- Верхняя панель с заголовком и выбором даты -->
        <div class="row mb-2">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h1 id="topMessage" class="h5 mb-0">Диаграмма потоков {{ default_date }}</h1>

                    <div class="dropdown me-2">
                        <button class="btn btn-outline-primary btn-sm dropdown-toggle" 
                                type="button" 
                                data-bs-toggle="dropdown">
                            <span id="selectedZone">{{ zone_types[0] if zone_types else 'Выберите зону' }}</span>
                        </button>
                        <ul class="dropdown-menu">
                            {% for zone_type in zone_types %}
                            <li>
                                <button class="dropdown-item" 
                                        type="button" 
                                        onclick="switchZoneType('{{ zone_type }}'); 
                                                 document.getElementById('selectedZone').textContent = '{{ zone_type }}'">
                                    {{ zone_type }}
                                </button>
                            </li>
                            {% endfor %}
                        </ul>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <label for="analysisDate" class="form-label mb-0 small">Выбор даты:</label>
                        <input type="date" id="analysisDate" value="{{ default_date }}" class="form-control form-control-sm">
                        
                        <!-- Автообновление -->
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" id="autoRefreshSwitch" checked>
                            <label class="form-check-label small" for="autoRefreshSwitch">Авто</label>
                        </div>
                        
                        <select id="refreshInterval" class="form-select form-select-sm" style="width: auto;">
                            <option value="60">1 мин</option>
                            <option value="300" selected>5 мин</option>
                            <option value="600">10 мин</option>
                            <option value="1800">30 мин</option>
                            <option value="3600">1 час</option>
                        </select>
                    </div>
                    
                  
                    <!--   Загрузка GIF   -->
                    <div class="dropdown ms-2">
    <button class="btn btn-success btn-sm dropdown-toggle" 
            type="button" 
            data-bs-toggle="dropdown">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="me-1">
            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
        </svg>
        GIF отчет
    </button>
    <ul class="dropdown-menu dropdown-menu-end p-3" style="min-width: 280px;">
        <li>
            <div class="mb-2">
                <label class="form-label small fw-bold">Интервал между кадрами</label>
                <select id="gifInterval" class="form-select form-select-sm">
                    <option value="15">15 мин</option>
                    <option value="30" selected>30 мин</option>
                    <option value="60">1 час</option>
                    <option value="120">2 часа</option>
                </select>
            </div>
        </li>
        <li>
            <div class="mb-2">
                <label class="form-label small fw-bold">Длительность кадра</label>
                <select id="gifDuration" class="form-select form-select-sm">
                    <option value="0.5">0.5 сек</option>
                    <option value="0.8">0.8 сек</option>
                    <option value="1.0" selected>1.0 сек</option>
                    <option value="1.5">1.5 сек</option>
                    <option value="2.0">2.0 сек</option>
                </select>
            </div>
        </li>
        <li>
            <button class="btn btn-success btn-sm w-100" onclick="downloadGif()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="me-1">
                    <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                    <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                </svg>
                Скачать GIF
            </button>
        </li>
        <li class="mt-2">
            <small class="text-muted" id="gifInfo">Ожидание данных...</small>
        </li>
    </ul>
</div>


                </div>
            </div>
        </div>

        <!-- Сообщение об ошибках/успехе -->
        <div id="uploadMessage" class="mb-2"></div>

        <!-- Индикатор загрузки -->
        <div id="loadingIndicator" class="alert alert-info d-none mb-2" role="alert">
            <div class="d-flex align-items-center">
                <div class="spinner-border spinner-border-sm me-2" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
                Загружаем данные...
            </div>
        </div>

        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-2 text-muted">Загрузка данных...</p>
        </div>

        <div id="chartContainer" class="chart-container" style="visibility: hidden;">
            <div id="chartContent"></div>
        </div>
    </div>

    <script>
        // Переменные состояния
        let currentZoneType = '{{ zone_types[0] if zone_types else "main" }}';
        let refreshTimer = null;
        let isAutoRefreshEnabled = true;

        // Функция переключения типа зоны
        function switchZoneType(type) {
            currentZoneType = type;
            loadSankeyData(true);
        }

        // --- Функции автообновления ---

        function toggleAutoRefresh() {
            const switchElement = document.getElementById('autoRefreshSwitch');
            isAutoRefreshEnabled = switchElement.checked;
            
            if (isAutoRefreshEnabled) {
                startAutoRefresh();
                showMessage('Автообновление включено', 'success');
            } else {
                stopAutoRefresh();
                showMessage('Автообновление выключено', 'info');
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh(); // Останавливаем старый таймер
            
            const intervalSelect = document.getElementById('refreshInterval');
            const intervalMs = parseInt(intervalSelect.value) * 1000;
            
            refreshTimer = setInterval(() => {
                if (isAutoRefreshEnabled) {
                    loadSankeyData(false);
                }
            }, intervalMs);
            
            // Показываем статус
            const minutes = intervalMs / 60000;
            console.log(`Автообновление запущено (каждые ${minutes} мин)`);
        }

        function stopAutoRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
                console.log('Автообновление остановлено');
            }
        }

        function onRefreshIntervalChange() {
            if (isAutoRefreshEnabled) {
                startAutoRefresh();
                const intervalSelect = document.getElementById('refreshInterval');
                const minutes = parseInt(intervalSelect.value) / 60;
                showMessage(`Интервал обновления изменен на ${minutes} мин`, 'info');
            }
        }

        // --- Вспомогательные функции ---

        // Обновление заголовка
        function updateTitle(dateString) {
            const formattedDate = dateString ? formatDate(dateString) : '{{ default_date }}';
            document.getElementById('topMessage').textContent = 
                `Диаграмма потоков ${currentZoneType} ${formattedDate}`;
        }

        // Форматирование даты
        function formatDate(dateString) {
            if (!dateString) return '{{ default_date }}';
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }

        // Отображение сообщений
        function showMessage(msg, type) {
            const div = document.getElementById('uploadMessage');
            const alertClass = type === 'error' ? 'alert-danger' : 
                              type === 'info' ? 'alert-info' : 'alert-success';
            div.innerHTML = `
                <div class="alert ${alertClass} alert-dismissible fade show small" role="alert">
                    ${msg}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => { div.innerHTML = ''; }, 5000);
        }

        // Показ/скрытие индикатора загрузки
        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('d-none');
            document.getElementById('loadingSpinner').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('d-none');
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        // Основная функция загрузки данных
        function loadSankeyData(showIndicator = true) {
            const date = document.getElementById('analysisDate').value;
            const zoneType = currentZoneType;

            // Обновляем заголовок
            updateTitle(date);

            if (showIndicator) {
                showLoading();
            }

            $('#chartContainer').css('visibility', 'hidden');

            $.ajax({
                url: `/sankey-chart?date=${date}&zone_type=${zoneType}`,
                method: 'GET',
                success: function(data) {
                    $('#chartContent').html(data);
                    
                    if (showIndicator) {
                        hideLoading();
                    }
                    
                    requestAnimationFrame(function() {
                        setTimeout(function() {
                            var graphDiv = document.querySelector('.plotly-graph-div');
                            if (graphDiv && typeof Plotly !== 'undefined') {
                                // Обновляем layout с autosize
                                Plotly.relayout(graphDiv, {
                                    autosize: true,
                                    height: undefined  // Убираем фиксированную высоту
                                });
                                
                                Plotly.Plots.resize(graphDiv);
                                
                                requestAnimationFrame(function() {
                                    $('#chartContainer').css('visibility', 'visible');
                                });
                            } else {
                                $('#chartContainer').css('visibility', 'visible');
                            }
                        }, 50);
                    });
                },
                error: function(xhr) {
                    if (showIndicator) {
                        hideLoading();
                    }
                    $('#chartContent').html(`
                        <div class="alert alert-danger">
                            Ошибка загрузки диаграммы: ${xhr.responseText || 'Неизвестная ошибка'}
                        </div>
                    `);
                    $('#chartContainer').css('visibility', 'visible');
                    showMessage('Ошибка загрузки диаграммы', 'error');
                }
            });
        }

        // --- Инициализация ---

        $(document).ready(function() {
            // Устанавливаем начальное значение зоны
            const zoneTypes = {{ zone_types|tojson }};
            if (zoneTypes && zoneTypes.length > 0) {
                currentZoneType = zoneTypes[0];
                document.getElementById('selectedZone').textContent = zoneTypes[0];
            }

            // Настройка обработчиков автообновления
            document.getElementById('autoRefreshSwitch').addEventListener('change', toggleAutoRefresh);
            document.getElementById('refreshInterval').addEventListener('change', onRefreshIntervalChange);
            
            // Автообновление при изменении даты
            document.getElementById('analysisDate').addEventListener('change', function() {
                loadSankeyData(true);
            });

            // Загрузка данных
            loadSankeyData(true);
            
            // Запуск автообновления (по умолчанию включено)
            if (document.getElementById('autoRefreshSwitch').checked) {
                startAutoRefresh();
            }
        });

        // Очистка таймера при закрытии страницы
        window.addEventListener('beforeunload', function() {
            stopAutoRefresh();
        });


    // Функция скачивания GIF с информацией о прогрессе
async function downloadGif() {
    const date = document.getElementById('analysisDate').value;
    const zoneType = currentZoneType;
    const interval = document.getElementById('gifInterval').value;
    const duration = document.getElementById('gifDuration').value;
    
    const btn = document.querySelector('.btn-success.dropdown-toggle');
    const originalText = btn.innerHTML;
    
    // Показываем прогресс
    btn.innerHTML = `
        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        Генерация...
    `;
    btn.disabled = true;
    
    try {
        showMessage('Генерация GIF-отчета... Это может занять 10-30 секунд', 'info');
        
        // Проверяем доступность данных
        const infoResponse = await fetch(`/sankey-gif-info?date=${date}&zone_type=${zoneType}`);
        const infoData = await infoResponse.json();
        
        if (infoData.valid_snapshots > 0) {
            document.getElementById('gifInfo').textContent = 
                `Найдено ${infoData.valid_snapshots} снимков с данными`;
        }
        
        // Скачиваем GIF
        const url = `/sankey-gif?date=${date}&zone_type=${zoneType}&interval_minutes=${interval}&duration=${duration}&max_frames=24`;
        
        // Открываем в новой вкладке для скачивания
        window.open(url, '_blank');
        
        showMessage('Генерация GIF началась. Файл будет скачан автоматически', 'success');
        
    } catch (error) {
        showMessage('Ошибка: ' + error.message, 'error');
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}


// Функция для обновления информации о GIF при смене даты
async function updateGifInfo() {
    const date = document.getElementById('analysisDate').value;
    const zoneType = currentZoneType;
    
    try {
        const response = await fetch(`/sankey-gif-info?date=${date}&zone_type=${zoneType}`);
        const data = await response.json();
        
        if (data.valid_snapshots > 0) {
            document.getElementById('gifInfo').textContent = 
                `${data.valid_snapshots} снимков с данными (${data.zones_count} зон)`;
        } else {
            document.getElementById('gifInfo').textContent = 
                'Нет данных для выбранной даты';
        }
    } catch (error) {
        document.getElementById('gifInfo').textContent = 'Ошибка получения информации';
    }
}

// Вызываем при загрузке страницы и смене даты
$(document).ready(function() {
    // ... существующий код ...
    
    // Добавляем обновление информации о GIF
    updateGifInfo();
    document.getElementById('analysisDate').addEventListener('change', updateGifInfo);
    document.querySelector('.dropdown-menu').addEventListener('show.bs.dropdown', updateGifInfo);
});


    </script>

    <!-- Bootstrap JS в конце -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
