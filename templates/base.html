<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Анализ движения{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="{{ url_for('static', path='/css/bootstrap.min.css') }}" rel="stylesheet">

    <!-- Блок для страничных CSS -->
    {% block styles %}{% endblock %}
</head>
<body class="bg-light">

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg navbar navbar-light" style="background-color: #e3f2fd;">
      <div class="container-fluid">
        <a class="navbar-brand" href="/"></a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link {% block nav_report %}{% endblock %}" href="/">Почасовой Отчет</a>
            <a class="nav-link {% block nav_sankey %}{% endblock %}" href="/sankey/">Sankey диаграмма</a>
            <a class="nav-link {% block nav_reports %}{% endblock %}" href="/admin/groups/zones/">Отчеты</a>
            <a class="nav-link {% block nav_groups %}{% endblock %}" href="/admin/groups/">Группы</a>
            <a class="nav-link {% block nav_data %}{% endblock %}" href="/upload/">Данные</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- ===== КОНТЕНТ СТРАНИЦЫ ===== -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Блок для страничных скриптов -->
    {% block scripts %}{% endblock %}
</body>
</html>
