<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка данных в базу</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            position: relative;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }
        
        .upload-text {
            color: #666;
            font-size: 16px;
        }
        
        .upload-text strong {
            color: #667eea;
            cursor: pointer;
        }
        
        .upload-text strong:hover {
            text-decoration: underline;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-info {
            display: none;
            background: #f0f4ff;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            color: #333;
            font-size: 14px;
        }
        
        .file-info.show {
            display: block;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        
        .btn-row {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(86, 171, 47, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }
        
        .btn-outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-outline:hover:not(:disabled) {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            
            .btn-row {
                flex-direction: column;
            }
            
            .upload-area {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Загрузка данных</h1>
        <p class="subtitle">Загрузите Excel файл для импорта данных в базу</p>
        
        <div class="upload-area" id="uploadArea">
            <span class="upload-icon">📁</span>
            <div class="upload-text">
                Перетащите файл сюда или <strong id="browseLink">выберите файл</strong>
            </div>
            <div style="font-size: 12px; color: #999; margin-top: 8px;">
                Поддерживаются .xlsx и .xls
            </div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>
        
        <div class="file-info" id="fileInfo">
            <strong>Выбран файл:</strong> <span id="fileName"></span>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" id="uploadBtn" disabled>
                📤 Загрузить в базу
            </button>
            
            <div class="btn-row">
                <button class="btn btn-danger" id="clearBtn">
                    🗑️ Очистить базу
                </button>
                <button class="btn btn-success" id="exportBtn">
                    📥 Выгрузить в Excel
                </button>
            </div>
        </div>
        
        <div class="message" id="message"></div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const browseLink = document.getElementById('browseLink');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const messageDiv = document.getElementById('message');
        
        let selectedFile = null;
        
        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message show ${type}`;
        }
        
        function hideMessage() {
            messageDiv.className = 'message';
        }
        
        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Загрузка...';
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.originalText || 'Загрузить в базу';
            }
        }
        
        function handleFile(file) {
            if (!file) {
                selectedFile = null;
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
                return;
            }
            
            const validExtensions = ['.xlsx', '.xls'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!validExtensions.includes(ext)) {
                showMessage('Пожалуйста, выберите файл .xlsx или .xls', 'error');
                selectedFile = null;
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
                return;
            }
            
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            uploadBtn.disabled = false;
            hideMessage();
        }
        
        // Клик по области загрузки
        browseLink.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });
        
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        // Drag and Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });
        
        // Загрузка файла
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            uploadBtn.dataset.originalText = 'Загрузить в базу';
            setLoading(uploadBtn, true);
            hideMessage();
            
            try {
                const response = await fetch('/upload/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Ошибка соединения: ${error.message}`, 'error');
            } finally {
                setLoading(uploadBtn, false);
                selectedFile = null;
                fileInput.value = '';
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
            }
        });
        
        // Очистка базы
        clearBtn.addEventListener('click', async () => {
            if (!confirm('Вы уверены, что хотите очистить всю базу данных?')) {
                return;
            }
            
            clearBtn.dataset.originalText = 'Очистить базу';
            clearBtn.disabled = true;
            clearBtn.innerHTML = '<span class="spinner"></span> Очистка...';
            hideMessage();
            
            try {
                const response = await fetch('/upload/clear', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Ошибка соединения: ${error.message}`, 'error');
            } finally {
                clearBtn.disabled = false;
                clearBtn.textContent = clearBtn.dataset.originalText;
            }
        });
        
        // Экспорт в Excel
        exportBtn.addEventListener('click', async () => {
            exportBtn.dataset.originalText = 'Выгрузить в Excel';
            exportBtn.disabled = true;
            exportBtn.innerHTML = '<span class="spinner"></span> Выгрузка...';
            hideMessage();
            
            try {
                const response = await fetch('/upload/export');
                
                if (!response.ok) {
                    const errorData = await response.json();
                    showMessage(`❌ ${errorData.message || 'Ошибка выгрузки'}`, 'error');
                    return;
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'export_database.xlsx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showMessage('✅ Данные успешно выгружены в Excel', 'success');
            } catch (error) {
                showMessage(`❌ Ошибка выгрузки: ${error.message}`, 'error');
            } finally {
                exportBtn.disabled = false;
                exportBtn.textContent = exportBtn.dataset.originalText;
            }
        });
    </script>
</body>
</html>
