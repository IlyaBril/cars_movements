<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка данных в базу</title>
    <!-- Подключение Bootstrap (как в первом фронте) -->
    <link href="{{ url_for('static', path='/css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        
        .upload-area {
            border: 3px dashed #dee2e6;
            border-radius: 0.5rem;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background-color: white;
        }
        
        .upload-area:hover {
            border-color: #0d6efd;
            background-color: #f8f9ff;
        }
        
        .upload-area.dragover {
            border-color: #0d6efd;
            background-color: #e7f1ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }
        
        .upload-text strong {
            color: #0d6efd;
            cursor: pointer;
        }
        
        .upload-text strong:hover {
            text-decoration: underline;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-info {
            display: none;
            background: #e7f1ff;
            padding: 10px 15px;
            border-radius: 0.375rem;
            margin: 15px 0;
            color: #0d6efd;
            font-size: 14px;
            border-left: 4px solid #0d6efd;
        }
        
        .file-info.show {
            display: block;
        }
        
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.2em;
        }
        
        .message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 0.375rem;
            display: none;
            font-size: 14px;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d1e7dd;
            color: #0a3622;
            border: 1px solid #a3cfbb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #58151c;
            border: 1px solid #f1aeb5;
        }
        
        .message.info {
            background: #cff4fc;
            color: #055160;
            border: 1px solid #9eeaf9;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-3">
        <!-- Верхняя панель с заголовком -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h1 class="h4 mb-0">Загрузка данных в базу</h1>
                </div>
                <p class="text-muted small mt-1 mb-0">Загрузите Excel файл (.xlsx, .xls) для импорта данных</p>
            </div>
        </div>

        <!-- Сообщение об ошибках/успехе -->
        <div id="messageContainer" class="mb-2"></div>

        <!-- Индикатор загрузки -->
        <div id="loadingIndicator" class="alert alert-info d-none mb-2" role="alert">
            <div class="d-flex align-items-center">
                <div class="spinner-border spinner-border-sm me-2" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
                Выполняется операция...
            </div>
        </div>

        <!-- Основная карточка -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body p-3">
                        <!-- Область загрузки -->
                        <div class="upload-area" id="uploadArea">
                            <span class="upload-icon">📁</span>
                            <div class="upload-text">
                                Перетащите файл сюда или <strong id="browseLink">выберите файл</strong>
                            </div>
                            <div class="text-muted small mt-2">
                                Поддерживаются .xlsx и .xls
                            </div>
                            <input type="file" id="fileInput" accept=".xlsx,.xls">
                        </div>
                        
                        <!-- Информация о выбранном файле -->
                        <div class="file-info" id="fileInfo">
                            <strong>Выбран файл:</strong> <span id="fileName"></span>
                        </div>
                        
                        <!-- Кнопки управления -->
                        <div class="row g-2 mt-3">
                            <div class="col-md-4">
                                <button class="btn btn-primary w-100" id="uploadBtn" disabled>
                                    📤 Загрузить
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-danger w-100" id="clearBtn">
                                    🗑️ Очистить
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-success w-100" id="exportBtn">
                                    📥 Выгрузить Excel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const browseLink = document.getElementById('browseLink');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const messageContainer = document.getElementById('messageContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        
        let selectedFile = null;

        // Показать сообщение
        function showMessage(text, type = 'info') {
            const alertClass = type === 'error' ? 'alert-danger' : 
                              type === 'success' ? 'alert-success' : 'alert-info';
            messageContainer.innerHTML = `
                <div class="alert ${alertClass} alert-dismissible fade show small mb-0" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function hideMessage() {
            messageContainer.innerHTML = '';
        }

        // Показать/скрыть индикатор загрузки
        function showLoading() {
            loadingIndicator.classList.remove('d-none');
        }

        function hideLoading() {
            loadingIndicator.classList.add('d-none');
        }

        // Обработка выбранного файла
        function handleFile(file) {
            if (!file) {
                selectedFile = null;
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
                return;
            }
            
            const validExtensions = ['.xlsx', '.xls'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!validExtensions.includes(ext)) {
                showMessage('Пожалуйста, выберите файл .xlsx или .xls', 'error');
                selectedFile = null;
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
                return;
            }
            
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            uploadBtn.disabled = false;
            hideMessage();
        }

        // Клик по области загрузки
        browseLink.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag and Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });

        // Загрузка файла
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Загрузка...';
            showLoading();
            hideMessage();
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Ошибка соединения: ${error.message}`, 'error');
            } finally {
                hideLoading();
                uploadBtn.disabled = false;
                uploadBtn.textContent = '📤 Загрузить';
                selectedFile = null;
                fileInput.value = '';
                fileInfo.classList.remove('show');
                uploadBtn.disabled = true;
            }
        });

        // Очистка базы
        clearBtn.addEventListener('click', async () => {
            if (!confirm('Вы уверены, что хотите очистить всю базу данных?')) {
                return;
            }
            
            clearBtn.disabled = true;
            clearBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Очистка...';
            showLoading();
            hideMessage();
            
            try {
                const response = await fetch('/upload/clear', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ Ошибка соединения: ${error.message}`, 'error');
            } finally {
                hideLoading();
                clearBtn.disabled = false;
                clearBtn.textContent = '🗑️ Очистить';
            }
        });

        // Экспорт в Excel
        exportBtn.addEventListener('click', async () => {
            exportBtn.disabled = true;
            exportBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Выгрузка...';
            showLoading();
            hideMessage();
            
            try {
                const response = await fetch('/upload/export');
                
                if (!response.ok) {
                    const errorData = await response.json();
                    showMessage(`❌ ${errorData.message || 'Ошибка выгрузки'}`, 'error');
                    return;
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'export_database.xlsx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showMessage('✅ Данные успешно выгружены в Excel', 'success');
            } catch (error) {
                showMessage(`❌ Ошибка выгрузки: ${error.message}`, 'error');
            } finally {
                hideLoading();
                exportBtn.disabled = false;
                exportBtn.textContent = '📥 Выгрузить Excel';
            }
        });

        // Автоматическое скрытие сообщений через 5 секунд (как в первом фронте)
        setInterval(() => {
            const alerts = messageContainer.querySelectorAll('.alert');
            alerts.forEach(alert => {
                if (!alert.querySelector('.btn-close')) {
                    const closeBtn = document.createElement('button');
                    closeBtn.type = 'button';
                    closeBtn.className = 'btn-close';
                    closeBtn.setAttribute('data-bs-dismiss', 'alert');
                    alert.appendChild(closeBtn);
                }
            });
        }, 1000);
    </script>
</body>
</html>
